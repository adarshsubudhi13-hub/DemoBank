<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DemoBank — Customer Dashboard</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body id="dashboard-view">
    <nav class="navbar">
        <div class="nav-brand">DemoBank</div>
        <div class="nav-actions">
            <span>Welcome, <strong id="user-welcome">Customer</strong></span>
            <button id="logout-btn" class="btn-outline">Log Out</button>
        </div>
    </nav>

    <main class="dashboard-container">
        <div class="card">
            <div class="card-title">Checking Account</div>
            <div style="font-size: 0.9rem; color: var(--muted);" id="account-number">**** **** **** 0000</div>
            <div class="balance-amount" id="account-balance">$0.00</div>
            <div style="font-size: 0.8rem; color: var(--success); font-weight: 500;">● Active &amp; Verified</div>
        </div>

        <div class="card">
            <div class="card-title">Recent Transactions</div>
            <div class="table-wrapper">
                <table>
                    <thead>
                        <tr>
                            <th>Date</th>
                            <th>Description</th>
                            <th>Amount</th>
                            <th>Balance</th>
                        </tr>
                    </thead>
                    <tbody id="transactions-body"></tbody>
                </table>
            </div>
        </div>
    </main>
    <script src="/js/app.js"></script>
</body>
</html>
