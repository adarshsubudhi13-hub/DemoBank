<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DemoBank — System Status</title>
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">DemoBank Telemetry</div>
        <div class="nav-actions">
            <a href="/" class="btn-outline" style="text-decoration: none;">Back to Login</a>
        </div>
    </nav>

    <main class="dashboard-container">
        <div class="card">
            <h2>Real-Time Authentication Counters</h2>
            <p style="color: var(--muted); font-size: 0.9rem; margin-top: 4px;">
                Victim target server metrics monitored live by Sentinel SOC.
            </p>

            <div class="kpi-grid" id="status-grid">
                <div class="kpi-tile">
                    <div style="font-weight: 600; color: var(--muted);">Total Attempts</div>
                    <div class="kpi-num" id="stat-attempts">0</div>
                </div>
                <div class="kpi-tile">
                    <div style="font-weight: 600; color: var(--muted);">Failed Attempts</div>
                    <div class="kpi-num" style="color: var(--error);" id="stat-failures">0</div>
                </div>
                <div class="kpi-tile">
                    <div style="font-weight: 600; color: var(--muted);">Blocked IPs</div>
                    <div class="kpi-num" style="color: var(--warning);" id="stat-blocked">0</div>
                </div>
                <div class="kpi-tile">
                    <div style="font-weight: 600; color: var(--muted);">Locked Accounts</div>
                    <div class="kpi-num" style="color: var(--warning);" id="stat-locked">0</div>
                </div>
            </div>
        </div>
    </main>
    <script src="/js/app.js"></script>
</body>
</html>
